services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: langgraph-compare-dev
    container_name: langgraph-compare-dev
    volumes:
      - .:/app
    env_file:
      - path: .env
        required: false
    ports:
      - "3000:2024"
    stdin_open: true
    tty: true
    command: bash
